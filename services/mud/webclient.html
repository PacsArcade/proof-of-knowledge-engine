<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>POKEMUD — play in your browser</title>
<!--
  POKEMUD web client (v1). Self-contained, no external assets. Connects over a WebSocket to the
  same POKEMUD engine the telnet client uses, and renders the server's ANSI redraws with a tiny
  in-browser interpreter + a CRT theme. This is a clean canvas — the site/design team can restyle
  it freely. Richer effects (canvas glow, sound, asciify) come with the server's JSON render mode.
-->
<style>
  :root { --phos:#39ff9e; --amber:#ffbe3c; --mag:#ff35c8; --bg:#05060a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--phos);
    font-family: "Cascadia Mono","DejaVu Sans Mono",Consolas,monospace; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:.75rem; padding:.4rem .8rem;
    border-bottom:1px solid #1c2130; background:linear-gradient(#0b0e16,#070910); }
  header .brand { color:var(--mag); font-weight:bold; letter-spacing:.05em; text-shadow:0 0 8px #ff35c880; }
  header .sub { color:#8a93a6; font-size:.85rem; }
  header .spacer { flex:1; }
  header a, header .dot { color:var(--amber); text-decoration:none; font-size:.85rem; }
  #dot { width:.6rem; height:.6rem; border-radius:50%; background:#556; display:inline-block; box-shadow:0 0 6px #000; }
  #dot.on { background:var(--phos); box-shadow:0 0 8px var(--phos); }
  #screenwrap { position:relative; flex:1; overflow:auto; padding:.6rem .8rem; }
  /* CRT scanlines + vignette overlay */
  #screenwrap::after { content:""; position:fixed; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px),
      radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.55)); }
  pre#screen { margin:0; white-space:pre; font-size:15px; line-height:1.18;
    text-shadow:0 0 3px currentColor; }
  footer { display:flex; gap:.5rem; padding:.5rem .8rem; border-top:1px solid #1c2130; background:#070910; }
  #cmd { flex:1; background:#0b0e16; color:var(--phos); border:1px solid #223; border-radius:6px;
    padding:.5rem .7rem; font-family:inherit; font-size:15px; outline:none; }
  #cmd:focus { border-color:var(--mag); box-shadow:0 0 0 2px #ff35c830; }
  #send { background:var(--mag); color:#0b0e16; border:0; border-radius:6px; padding:0 1rem; font-weight:bold; cursor:pointer; }
  #hint { color:#67708a; font-size:.8rem; padding:0 .8rem .4rem; }
  @media (max-width:640px){ pre#screen{ font-size:12px; } header .sub{ display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="brand">◆ POKEMUD</span>
    <span class="sub">Proof of Knowledge Engine · play in your browser</span>
    <span class="spacer"></span>
    <span id="site"></span>
    <span id="dot" title="connection"></span>
  </header>
  <div id="screenwrap"><pre id="screen">connecting to the arcade…</pre></div>
  <div id="hint">type below and press Enter · try <b>help</b> · <b>talk oracle</b> · <b>go down</b> to the boss</div>
  <footer>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="name yourself, then type commands…" />
    <button id="send">Send ⏎</button>
  </footer>
</div>
<script>
(() => {
  const screenEl = document.getElementById('screen');
  const cmd = document.getElementById('cmd');
  const dot = document.getElementById('dot');
  const siteEl = document.getElementById('site');
  let ws = null, buffer = '';

  // xterm-256 → CSS color (matches the server's \x1b[38;5;Nm palette exactly).
  const STD = ['#000','#c00','#0c0','#cc0','#00c','#c0c','#0cc','#ccc',
               '#555','#f55','#5f5','#ff5','#55f','#f5f','#5ff','#fff'];
  function xterm(n){
    if(n<16) return STD[n];
    if(n<232){ n-=16; const r=(n/36|0), g=((n%36)/6|0), b=n%6, c=v=>v?55+v*40:0;
      return `rgb(${c(r)},${c(g)},${c(b)})`; }
    const v=8+(n-232)*10; return `rgb(${v},${v},${v})`;
  }
  // Convert an ANSI string to HTML: honor \x1b[0m/1m and \x1b[38;5;Nm; strip cursor/clear codes.
  function ansiToHtml(text){
    text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const re = /\x1b\[([0-9;]*)([A-Za-z])/g;
    let out='', last=0, m, color=null, bold=false;
    const span = t => { if(!t) return ''; const s=[]; if(color)s.push('color:'+color);
      if(bold)s.push('font-weight:bold'); return s.length?`<span style="${s.join(';')}">${t}</span>`:t; };
    while((m = re.exec(text))){
      out += span(text.slice(last, m.index));
      last = re.lastIndex;
      if(m[2] === 'm'){
        const codes = m[1].split(';').filter(x=>x!=='').map(Number);
        if(codes.length===0){ color=null; bold=false; }
        for(let j=0;j<codes.length;j++){
          const c=codes[j];
          if(c===0){ color=null; bold=false; }
          else if(c===1){ bold=true; }
          else if(c===38 && codes[j+1]===5){ color=xterm(codes[j+2]); j+=2; }
          else if(c===39){ color=null; }
        }
      } // any other final byte (H,J,K,t) → stripped (full-frame redraw handles it)
    }
    out += span(text.slice(last));
    return out;
  }
  function render(){
    // Keep only from the last clear/home = the current full screen the server drew.
    const cut = Math.max(buffer.lastIndexOf('\x1b[2J'), buffer.lastIndexOf('\x1b[H'));
    if(cut > 0) buffer = buffer.slice(cut);
    screenEl.innerHTML = ansiToHtml(buffer);
  }

  async function connect(){
    let cfg = { ws_port: 4002, local_site:'', node:'a POKE node' };
    try { cfg = await (await fetch('/config')).json(); } catch(e){}
    if(cfg.local_site) siteEl.innerHTML = `<a href="${cfg.local_site}">← the arcade</a> · `;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.hostname}:${cfg.ws_port}`;
    ws = new WebSocket(url);
    ws.onopen  = () => { dot.classList.add('on'); buffer=''; cmd.focus(); };
    ws.onmessage = (e) => { buffer += e.data; render();
      document.getElementById('screenwrap').scrollTop = 1e9; };
    ws.onclose = () => { dot.classList.remove('on');
      buffer += '\r\n\x1b[38;5;196m-- the arcade lights went dark. reconnecting… --\x1b[0m\r\n'; render();
      setTimeout(connect, 1500); };
    ws.onerror = () => { try{ ws.close(); }catch(e){} };
  }
  function send(){
    const v = cmd.value; cmd.value='';
    if(ws && ws.readyState === 1) ws.send(v);
  }
  document.getElementById('send').onclick = send;
  cmd.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); send(); } });
  connect();
})();
</script>
</body>
</html>
