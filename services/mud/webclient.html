<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>POKEMUD — play in your browser</title>
<!--
  POKEMUD web client (v2 — JSON render mode). Self-contained, no external assets. Connects over a
  WebSocket to the POKE engine, which sends STRUCTURED screen state (not ANSI), so this page renders
  the game as real UI with real effects. This is the seam for the login/experience overhaul — the
  design team can restyle everything below freely; the JSON protocol (t:"hello" / t:"screen") is the
  contract with the server (services/mud/server.py :: screen_model).
-->
<style>
  :root{
    --bg:#05060a; --panel:#0b0e16; --ink:#cdd6ea; --dim:#6b7690; --line:#1b2233;
    --green:#39ff9e; --amber:#ffbe3c; --cyan:#39e6ff; --magenta:#ff35c8; --grey:#9aa6bd;
    --red:#ff5a5a; --gold:#ffd24a; --accent:var(--green);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 0%,#0a0e18,#04050a 70%);
    color:var(--ink);font-family:"Cascadia Mono","DejaVu Sans Mono",Consolas,monospace}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px),
    radial-gradient(120% 120% at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.6))}
  #app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:.6rem}
  .top{display:flex;align-items:center;gap:.6rem;padding:.3rem .4rem}
  .brand{color:var(--magenta);font-weight:bold;letter-spacing:.06em;text-shadow:0 0 10px #ff35c870}
  .top .sub{color:var(--dim);font-size:.82rem}
  .spacer{flex:1}
  .top a{color:var(--amber);text-decoration:none;font-size:.85rem}
  #dot{width:.6rem;height:.6rem;border-radius:50%;background:#445;box-shadow:0 0 6px #000}
  #dot.on{background:var(--green);box-shadow:0 0 9px var(--green)}

  /* ---- login (attract mode) ---- */
  #login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem;position:relative}
  #stars{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
  #login .marquee{color:var(--dim);letter-spacing:.3em;font-size:.8rem}
  #login h1{margin:.2rem 0;font-size:clamp(1.6rem,7vw,3rem);letter-spacing:.18em;
    background:linear-gradient(90deg,var(--gold),var(--cyan),var(--magenta),var(--gold));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:glim 4s linear infinite;text-shadow:0 0 30px #ff35c840}
  @keyframes glim{to{background-position:300% 0}}
  #login .tag{color:var(--amber)} #login .node{color:var(--dim);font-size:.85rem}
  #login .oracle{color:var(--grey);max-width:34rem;font-size:.9rem;line-height:1.5;margin:.6rem 0;min-height:4.2em}
  #login .oracle .caret{display:inline-block;width:.55em;background:var(--grey);animation:caret .8s steps(1) infinite;height:1em;vertical-align:-.15em}
  @keyframes caret{50%{opacity:0}}
  .coinline{color:var(--gold);font-weight:bold;letter-spacing:.15em;animation:coinblink 1.1s steps(1) infinite;text-shadow:0 0 14px var(--gold)}
  @keyframes coinblink{50%{opacity:.2}}
  #login.hidden{display:none}

  /* ---- CRT power-on ---- */
  #crt{position:fixed;inset:0;z-index:96;pointer-events:none;background:#000;opacity:1;animation:crtfade .45s ease-out .8s forwards}
  #crt::after{content:"";position:absolute;left:0;right:0;top:50%;height:100%;
    background:linear-gradient(#fff,#cfe9ff);opacity:0;filter:blur(.5px);
    transform:translateY(-50%) scaleY(.004);animation:crtline .8s cubic-bezier(.25,.8,.35,1) forwards}
  @keyframes crtline{0%{opacity:1;transform:translateY(-50%) scaleY(.004)}
    35%{opacity:1;transform:translateY(-50%) scaleY(.012)}
    100%{opacity:1;transform:translateY(-50%) scaleY(1)}}
  @keyframes crtfade{to{opacity:0;visibility:hidden}}

  /* ---- level-up burst ---- */
  #burst{position:fixed;inset:0;z-index:70;pointer-events:none}

  /* ---- game ---- */
  #game{flex:1;display:none;flex-direction:column;gap:.5rem}
  #game.show{display:flex}
  .hud{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.85rem;color:var(--dim)}
  .hud b{color:var(--gold)} .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:.15rem .6rem}
  .bar{display:inline-block;width:90px;height:.5rem;background:#141a28;border-radius:5px;overflow:hidden;vertical-align:middle}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
  .energy>i{background:linear-gradient(90deg,#ff7a5a,var(--green))}
  .panel{position:relative;border:1px solid var(--accent);border-radius:12px;background:linear-gradient(#0a0e17,#070a11);
    box-shadow:0 0 0 1px #0006,0 0 24px -6px var(--accent);padding:1rem 1.1rem;min-height:16rem}
  .panel .title{position:absolute;top:-.72rem;left:1rem;background:var(--bg);padding:0 .5rem;color:var(--accent);
    text-shadow:0 0 10px var(--accent);font-size:.9rem;letter-spacing:.04em}
  .panel pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);
    font-size:15px;line-height:1.35;text-shadow:0 0 3px #0008}
  #pmedia:empty{display:none}
  #pmedia{margin:0 0 .7rem}
  #pmedia img,#pmedia video{max-width:100%;max-height:260px;border:1px solid var(--line);
    border-radius:8px;box-shadow:0 0 18px -6px var(--accent);display:block}
  .exits{display:flex;gap:.4rem;flex-wrap:wrap}
  .door{cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--accent);color:var(--accent);
    border-radius:8px;padding:.25rem .6rem;font-size:.85rem;text-shadow:0 0 8px var(--accent)}
  .door:hover{background:var(--accent);color:#06070c}
  .log{min-height:2.2rem;color:var(--grey);font-size:.85rem;line-height:1.5}
  .log div{opacity:.9}
  footer{display:flex;gap:.5rem;padding:.5rem .3rem 0}
  #cmd{flex:1;background:var(--panel);color:var(--green);border:1px solid #243;border-radius:9px;padding:.55rem .8rem;
    font-family:inherit;font-size:15px;outline:none}
  #cmd:focus{border-color:var(--magenta);box-shadow:0 0 0 2px #ff35c830}
  #send{background:var(--magenta);color:#06070c;border:0;border-radius:9px;padding:0 1.1rem;font-weight:bold;cursor:pointer}

  /* ---- effects ---- */
  @keyframes etchpulse{0%,100%{box-shadow:0 0 24px -6px var(--gold)}50%{box-shadow:0 0 60px 4px var(--gold)}}
  .fx-etch{animation:etchpulse .5s ease-in-out 3}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
  .fx-victory{animation:shake .5s 2}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;pointer-events:none;
    background:linear-gradient(#1a1330,#0b0a1c);border:1px solid var(--gold);color:var(--gold);
    padding:.6rem 1.4rem;border-radius:12px;font-weight:bold;letter-spacing:.08em;text-shadow:0 0 14px var(--gold);
    box-shadow:0 0 40px -8px var(--gold);opacity:0;transition:opacity .3s}
  #toast.show{opacity:1}
  #end{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem;color:var(--gold)}
  #end #endmsg div{margin:.25rem 0;font-size:1.05rem;text-shadow:0 0 12px var(--gold)}
  #end a{color:var(--amber);text-decoration:none}
  @media (max-width:560px){.panel{min-height:13rem}.top .sub{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="brand">◆ POKEMUD</span><span class="sub">Proof of Knowledge Engine</span>
    <span class="spacer"></span><span id="site"></span>
    <button id="mute" title="sound on/off" style="background:none;border:0;cursor:pointer;font-size:1rem;line-height:1">🔇</button>
    <span id="dot" title="connection"></span>
  </div>

  <section id="login">
    <canvas id="stars"></canvas>
    <div class="marquee">PAC'S ARCADE</div>
    <div class="marquee" style="margin-top:-.2rem">presents</div>
    <h1>P O K E M U D</h1>
    <div class="tag">Proof of Knowledge Engine</div>
    <div class="node" id="node"></div>
    <div class="oracle" id="oracle-quote" aria-label="I don't hand out answers — I trade in questions. Show me you truly understand a thing, and I'll etch it into a rune only you can carry. Insert a token, fren."></div>
    <div class="coinline">▶ INSERT COIN — name yourself below ◀</div>
  </section>

  <section id="game">
    <div class="hud" id="hud"></div>
    <div class="panel" id="panel"><div class="title" id="ptitle"></div><div id="pmedia"></div><pre id="body"></pre></div>
    <div class="exits" id="exits"></div>
    <div class="log" id="log"></div>
  </section>

  <section id="end">
    <div id="endmsg"></div>
    <div style="margin-top:1rem"><button id="again" class="door">▸ play again</button> <span id="endsite"></span></div>
  </section>

  <footer id="foot">
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="name yourself…">
    <button id="send">Send ⏎</button>
  </footer>
</div>
<div id="toast"></div>
<div id="crt"></div>
<canvas id="burst"></canvas>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const THEME = {green:'#39ff9e',amber:'#ffbe3c',cyan:'#39e6ff',magenta:'#ff35c8',grey:'#9aa6bd',red:'#ff5a5a',gold:'#ffd24a'};
  // one arrow family — filled triangles for the compass, hollow for vertical (up/down)
  const ARROW = {north:'▲ north',south:'▼ south',east:'► east',west:'◄ west',up:'△ up',down:'▽ down'};
  let ws=null, named=false, done=false, endSite='';

  /* ---- retro sound (WebAudio, no assets; silent until the fren opts in) ---- */
  let AC=null, muted = localStorage.getItem('poke_mute')!=='0';   // default: muted
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(AC && AC.state==='suspended') AC.resume().catch(()=>{});
    return AC; }
  function blip(freq,dur,type,vol,slide){
    if(muted) return; const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), a.currentTime+dur);
    g.gain.setValueAtTime(vol||.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }
  const seq = (notes,step,dur,type,vol) => notes.forEach((f,i)=>setTimeout(()=>blip(f,dur,type,vol),i*step));
  const sfx = {
    send:   ()=>blip(660,.05,'square',.025),
    coin:   ()=>{blip(988,.09,'square',.05); setTimeout(()=>blip(1319,.2,'square',.05),85);},
    etch:   ()=>seq([523,659,784,1047],90,.12,'triangle',.05),
    victory:()=>seq([392,523,659,784],80,.1,'square',.045),
    levelup:()=>seq([523,659,784,1047,1319],70,.09,'square',.05),
  };
  function renderMute(){ $('mute').textContent = muted ? '🔇' : '🔊'; }
  $('mute').onclick = () => { muted=!muted; localStorage.setItem('poke_mute', muted?'1':'0'); renderMute(); if(!muted) sfx.coin(); };
  renderMute();

  /* ---- starfield behind the attract screen ---- */
  (function stars(){
    const cv=$('stars'), cx=cv.getContext('2d');
    const COLORS=['#39e6ff','#ff35c8','#ffd24a','#9aa6bd'];
    let pts=[], raf=null;
    function size(){ cv.width=cv.offsetWidth; cv.height=cv.offsetHeight;
      pts=Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
        r:Math.random()*1.6+.4,v:Math.random()*.25+.06,c:COLORS[Math.random()*COLORS.length|0],p:Math.random()*6.28})); }
    function tick(t){
      if($('login').classList.contains('hidden')){ raf=null; return; }
      cx.clearRect(0,0,cv.width,cv.height);
      for(const s of pts){
        s.y-=s.v; if(s.y<-2){ s.y=cv.height+2; s.x=Math.random()*cv.width; }
        cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));
        cx.fillStyle=s.c; cx.fillRect(s.x,s.y,s.r,s.r);
      }
      cx.globalAlpha=1; raf=requestAnimationFrame(tick);
    }
    size(); window.addEventListener('resize',size); raf=requestAnimationFrame(tick);
  })();

  /* ---- typewriter for the Oracle's pitch ---- */
  (function typewriter(){
    const el=$('oracle-quote'), txt=el.getAttribute('aria-label');
    const caret=document.createElement('span'); caret.className='caret';
    let i=0;
    setTimeout(function type(){
      el.textContent=txt.slice(0,i); el.appendChild(caret);
      if(i++ <= txt.length && !$('login').classList.contains('hidden')) setTimeout(type, 16);
      else caret.remove();
    }, 950);            // starts as the CRT finishes warming up
  })();

  /* ---- level-up particle burst ---- */
  function burst(){
    const cv=$('burst'), cx=cv.getContext('2d');
    cv.width=innerWidth; cv.height=innerHeight;
    const P=Array.from({length:70},()=>{
      const a=Math.random()*6.28, sp=Math.random()*6+2;
      return {x:cv.width/2,y:cv.height*.35,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
        c:['#ffd24a','#39e6ff','#ff35c8','#39ff9e'][Math.random()*4|0],l:1};
    });
    const t0=performance.now();
    (function tick(t){
      const dt=(t-t0)/900;
      cx.clearRect(0,0,cv.width,cv.height);
      if(dt>=1) return;
      for(const p of P){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.18;
        cx.globalAlpha=1-dt; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,3,3);
      }
      cx.globalAlpha=1; requestAnimationFrame(tick);
    })(t0+1);
  }

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
  function fx(list){ if(!list||!list.length) return; const panel=$('panel');
    if(list.includes('etch')){ panel.classList.remove('fx-etch'); void panel.offsetWidth; panel.classList.add('fx-etch'); sfx.etch(); }
    if(list.includes('victory')){ panel.classList.remove('fx-victory'); void panel.offsetWidth; panel.classList.add('fx-victory'); sfx.victory(); }
    if(list.includes('levelup')){ toast('★ LEVEL UP ★'); burst(); sfx.levelup(); }
  }
  function renderScreen(m){
    if(!named){ named=true; $('login').classList.add('hidden'); $('game').classList.add('show'); $('cmd').placeholder='type a command…'; sfx.coin(); }
    const accent = THEME[m.color] || THEME.green;
    document.documentElement.style.setProperty('--accent', accent);
    const h=m.hud||{};
    $('hud').innerHTML =
      `<span class="chip">Lv <b>${h.level??1}</b>${h.rank?` <span style="color:var(--amber)">${escapeHtml(h.rank)}</span>`:''}</span>`+
      `<span class="chip">✦ ${h.xp??0} xp <span class="bar"><i style="width:${(h.xp_into??0)}%"></i></span></span>`+
      `<span class="chip">🎓 <b>${h.runes??0}</b></span>`+
      `<span class="chip energy">⚡ <span class="bar"><i style="width:${(h.energy??100)}%"></i></span></span>`+
      `<span class="spacer"></span><span class="chip">${m.who||''} · ${m.room||''}</span>`;
    $('ptitle').textContent = m.title||m.room||'';
    // real ordinal/rune media when the node allows it (terminals always get the ASCII rendition)
    const md = m.media;
    if(md && md.url && /^https?:/i.test(md.url)){
      $('pmedia').innerHTML = md.kind==='video'
        ? `<video src="${encodeURI(md.url)}" autoplay loop muted playsinline></video>`
        : `<img src="${encodeURI(md.url)}" alt="">`;
    }else{
      $('pmedia').innerHTML = '';
    }
    $('body').textContent = (m.body||[]).join('\n');
    $('exits').innerHTML='';
    (m.exits||[]).forEach(d=>{ const el=document.createElement('div'); el.className='door'; el.textContent=ARROW[d]||d;
      el.onclick=()=>sendCmd(d); $('exits').appendChild(el); });
    $('log').innerHTML = (m.log||[]).filter(x=>x.trim()).map(x=>`<div>${escapeHtml(x)}</div>`).join('');
    fx(m.fx);
  }
  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function connect(){
    let cfg={ws_port:4002,local_site:'',node:'a POKE node'};
    try{ cfg=await (await fetch('/config')).json(); }catch(e){}
    if(cfg.local_site){ endSite=cfg.local_site; $('site').innerHTML=`<a href="${cfg.local_site}">← the arcade</a> · `; }
    const proto = location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${proto}://${location.hostname}:${cfg.ws_port}`);
    ws.onopen=()=>{ $('dot').classList.add('on'); $('cmd').focus(); };
    ws.onmessage=(e)=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
      if(m.t==='hello'){ if(m.node) $('node').textContent='· '+m.node+' ·'; }
      else if(m.t==='prompt'){ $('node').textContent = m.text||''; }
      else if(m.t==='screen'){ renderScreen(m); }
      else if(m.t==='bye'){ done=true; showEnd(m.lines||['Goodnight, fren.']); }
      else if(m.t==='signout'){ done=true; showEnd([m.text||'Signed out.','You opened POKEMUD on another device.']); }
    };
    ws.onclose=()=>{ $('dot').classList.remove('on'); if(done) return; toast('reconnecting…'); setTimeout(connect,1500); };
    ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
  }
  function showEnd(lines){
    $('login').classList.add('hidden'); $('game').classList.remove('show'); $('foot').style.display='none';
    $('end').style.display='flex';
    $('endmsg').innerHTML = lines.map(l=>`<div>${escapeHtml(l)}</div>`).join('');
    $('endsite').innerHTML = endSite ? ` · <a href="${endSite}">back to the arcade</a>` : '';
    $('again').onclick=()=>location.reload();
  }
  function sendCmd(v){ if(ws&&ws.readyState===1){ ws.send(v); sfx.send(); } }
  function submit(){ const v=$('cmd').value; $('cmd').value=''; sendCmd(v); }
  $('send').onclick=submit;
  $('cmd').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); }});
  connect();
})();
</script>
</body>
</html>
