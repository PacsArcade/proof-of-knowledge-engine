# Dev config for the OFFLINE joined Luanti world (block 969,188). Runs with podman --network host,
# so the mod reaches the dev state-sync on the host loopback. Never use on a public server.
server_name = Pacs Arcade Voxel Verse (dev)
server_description = Offline dev world joined to the MUD lever. Mine knowledge, fren.
port = 30000
bind_address = 0.0.0.0
server_dedicated = true
server_announce = false
max_users = 8
mg_name = flat
creative_mode = true
enable_damage = false
default_privs = interact, shout, fly, fast

secure.enable_security = true
secure.trusted_mods = pacsarcade
secure.http_mods = pacsarcade

# The mod's own settings
pacsarcade.state_sync_url = http://127.0.0.1:5212
pacsarcade.world_id = default
pacsarcade.lever_object_id = vault_lever
pacsarcade.dev_hooks = true
