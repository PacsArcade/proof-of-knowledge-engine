# ===========================================================================
# Bitcoin Core Configuration — REGTEST  (the `bitcoin` service, COLD tier)
# ===========================================================================
# This is the SAFE DEFAULT for Pac's Arcade. regtest is a private, disposable
# blockchain you fully control: you mine your own blocks instantly, coins have
# NO real-world value, and nothing here touches the real Bitcoin network.
#
# WHY REGTEST IS THE DEFAULT (money safety):
#   The seed-loot mechanic scatters Shamir-Secret-Shared wallet seeds as in-game
#   loot. On regtest a "lost" seed loses nothing real — it's the sandbox where
#   the Custodian is developed and tested. Mainnet is GATED: it requires the
#   operator to set PA_MAINNET_ACK=true AND pass a `security-auditor` review
#   (see docs/SECURITY.md) before a single real sat is ever in play.
#
# Mirrors the style of bitcoin.mainnet.conf.reference. The node-wizard /
# node-doctor templates the RPC creds from your .env.
# ===========================================================================

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# Run on the private regression-test chain. This is the master safety switch.
regtest=1

# Run the RPC server so bitcoin-bridge (the Vault) can drive the node.
server=1

# ---------------------------------------------------------------------------
# RPC — the interface bitcoin-bridge uses to mine, fund, and manage seed loot
# ---------------------------------------------------------------------------
# regtest-scoped settings live under the [regtest] section so they never leak
# into another network's config by accident.
[regtest]

# RPC on the standard regtest port.
rpcport=18443

# P2P on the standard regtest port (only matters if you connect >1 node).
port=18444

# Bind RPC to all interfaces INSIDE the container so sibling services on the
# docker `cold` network can reach it. This is acceptable ONLY because (a) it's
# regtest with no real funds and (b) the compose file does not publish RPC
# beyond the host. On mainnet you would bind 127.0.0.1 like the reference conf.
rpcbind=0.0.0.0
rpcallowip=127.0.0.1/32
rpcallowip=10.0.0.0/8        # docker/private ranges so bitcoin-bridge can connect
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16

# RPC credentials. The node-wizard templates these from your .env
# (PA_BITCOIN_RPC_USER / PA_BITCOIN_RPC_PASSWORD). The defaults below match
# .env.example for a fresh box — CHANGE them before exposing anything, and
# prefer `rpcauth=` (salted hash) over a plaintext password in production.
rpcuser=arcade
rpcpassword=change-me

# Regtest wallets need a fallback fee to build transactions (there's no fee
# market on a private chain). Harmless here; never set this on mainnet.
fallbackfee=0.0002

# ---------------------------------------------------------------------------
# Indexes
# ---------------------------------------------------------------------------

# Full transaction index — required so the Vault can look up any tx by txid
# (OP_RETURN discovery, verifying revealed seed-loot artifacts, tips).
txindex=1

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Shrink the debug log when it grows past the built-in cap.
shrinkdebugfile=1

# ---------------------------------------------------------------------------
# Data Directory
# ---------------------------------------------------------------------------
# The compose file passes -datadir=/data and mounts this file at
# /data/bitcoin.conf; the regtest chain persists in the `bitcoin-data` volume.
# It's disposable — delete the volume to start a fresh chain any time.
